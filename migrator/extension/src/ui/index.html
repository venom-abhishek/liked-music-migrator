<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music Mover — for YouTube Music</title>
  <link rel="icon" href="../../icons/icon-32.png" />
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="brand" data-nav="home" aria-label="Music Mover home">
        <img src="../../icons/icon-48.png" alt="" width="28" height="28" />
        <span>Music Mover</span>
      </button>
      <nav class="tabs" aria-label="Main">
        <button data-nav="home">Home</button>
        <button data-nav="library">My music</button>
        <button data-nav="import">Bring songs in</button>
        <button data-nav="history">History</button>
      </nav>
    </div>
  </header>

  <main id="main">
    <section id="view-home" class="view"></section>
    <section id="view-library" class="view" hidden></section>
    <section id="view-import" class="view" hidden></section>
    <section id="view-history" class="view" hidden></section>
  </main>

  <div id="dialog-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
