<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>YouTube Music Manager & Migrator</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>YouTube Music Manager</h1>
      <p id="tab-status" class="status">Checking…</p>
      <nav>
        <button data-view="collections" class="active">Library</button>
        <button data-view="log">Activity &amp; Undo</button>
      </nav>
    </header>

    <section id="view-collections">
      <div class="toolbar">
        <button id="refresh-collections">Refresh</button>
        <span class="hint">Playlists and Liked Songs in your account.</span>
      </div>
      <div id="collections-list"></div>
    </section>

    <section id="view-collection-detail" hidden>
      <div class="toolbar toolbar-detail">
        <button id="back-to-collections">&larr; Back</button>
        <h2 id="detail-title"></h2>
        <button id="refresh-collection-detail" title="Re-fetch from YouTube Music">↻</button>
        <input id="filter-input" type="text" placeholder="Filter title / artist / album" />
        <select id="sort-select">
          <option value="_fetchIndex">Date added</option>
          <option value="title">Title</option>
          <option value="artistsDisplay">Artist</option>
          <option value="album">Album</option>
          <option value="duration_seconds">Duration</option>
        </select>
        <button id="sort-dir">↓</button>
      </div>
      <div class="toolbar toolbar-actions">
        <span id="selection-count">0 selected</span>
        <button id="select-all">Select all (filtered)</button>
        <button id="clear-selection">Clear</button>
        <button id="action-remove" disabled>Remove</button>
        <button id="action-unlike" disabled hidden>Un-like</button>
        <select id="move-target"></select>
        <button id="action-move" disabled>Move to…</button>
      </div>
      <p class="hint">Undo restores membership, not position — a restored track is re-added to the end.</p>
      <div id="track-list" class="vlist-container"></div>
    </section>

    <section id="view-log" hidden>
      <div id="log-list"></div>
    </section>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
